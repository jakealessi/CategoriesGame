<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Home Screen -->
        <div id="home-screen" class="screen active">
            <h1>🎯 Categories Game</h1>
            <p class="subtitle">Name things in a category. Get more points for niche answers! Autocorrect included.</p>
            <div class="button-group">
                <button id="create-game-btn" class="btn btn-primary">Create New Game</button>
                <div class="join-section">
                    <input type="text" id="room-code-input" placeholder="Enter Room Code" maxlength="6">
                    <button id="join-game-btn" class="btn btn-secondary">Join Game</button>
                </div>
            </div>
        </div>

        <!-- Waiting Room Screen -->
        <div id="waiting-screen" class="screen">
            <h2>Waiting Room</h2>
            <div class="room-code-display">
                <p>Room Code:</p>
                <div id="room-code" class="room-code"></div>
                <button id="copy-code-btn" class="btn btn-small">Copy Code</button>
            </div>
            
            <div class="name-input-section">
                <label for="player-name-input">Your Name:</label>
                <div class="name-input-group">
                    <input type="text" id="player-name-input" placeholder="Enter your name" maxlength="20">
                    <button id="update-name-btn" class="btn btn-small btn-secondary">Update</button>
                </div>
            </div>

            <div id="player-list" class="player-list">
                <div class="player-item">Waiting for players...</div>
            </div>
            
            <div class="waiting-actions">
                <button id="start-game-btn" class="btn btn-primary" style="display: none;">Start Game</button>
                <button id="leave-game-btn" class="btn btn-danger">Leave Game</button>
            </div>
            
            <p class="hint">Share the room code with friends to start playing! (1-4 players)</p>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="timer-container">
                    <div id="timer" class="timer">60</div>
                    <div class="timer-label">seconds</div>
                </div>
                <div class="category-container">
                    <h2 id="category" class="category">Category</h2>
                </div>
                <div id="scores-container" class="scores">
                    <!-- Scores will be dynamically generated -->
                </div>
            </div>

            <div class="answer-input-container">
                <input type="text" id="answer-input" placeholder="Type your answer..." autocomplete="off">
                <button id="submit-answer-btn" class="btn btn-primary">Submit</button>
            </div>

            <div id="feedback" class="feedback"></div>

            <div class="all-answers-container">
                <h3>All Players' Answers:</h3>
                <div id="all-answers-list" class="all-answers-list"></div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <h2>🏆 Game Over!</h2>
            <div id="winner-announcement" class="winner-announcement"></div>
            <div id="final-scores" class="final-scores"></div>
            <button id="play-again-btn" class="btn btn-primary">Play Again</button>
        </div>

        <!-- Error Messages -->
        <div id="error-message" class="error-message"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
